# Development services only. Django and Celery run on the host:
#   docker compose up -d
#   python manage.py migrate && python manage.py runserver
#   celery -A config worker -l info
#   celery -A config beat -l info      # hourly streak recompute
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: routine
      POSTGRES_PASSWORD: routine
      POSTGRES_DB: routine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine -d routine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
